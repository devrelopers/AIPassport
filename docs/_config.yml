title: AIPassport
description: OAuth-inspired delegated AI access — an exploratory reference implementation
remote_theme: just-the-docs/just-the-docs

url: "https://devrelopers.github.io"
baseurl: "/AIPassport"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-include-cache

# Footer
aux_links:
  "GitHub":
    - "https://github.com/devrelopers/AIPassport"
  "Releases":
    - "https://github.com/devrelopers/AIPassport/releases"
  "Devrelopers":
    - "https://github.com/devrelopers"

aux_links_new_tab: true

footer_content: "AIPassport is an exploratory reference implementation. Not a finalized standard. MIT License."

# Search
search_enabled: true
search:
  heading_level: 3

# Color scheme
color_scheme: light

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Exclude non-doc files
exclude:
  - Gemfile.lock
